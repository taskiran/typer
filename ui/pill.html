<!doctype html>
<meta charset="utf-8">
<title>Typer</title>
<!--
  Kapsül.

  Tek pencere, iki şekil. Konuşurken canlı bir ölçerden ve başka hiçbir
  şeyden ibaret küçük bir kapsüldür — düğme yoktur, çünkü kontrol tuşun
  kendisidir. Yazacak bir yer bulunamadığında yukarı doğru büyüyerek
  kelimeleri ve bir Kopyala düğmesini taşıyan bir karta dönüşür ve alınana
  kadar orada durur.

  Ölçer bir döngüden değil, motorun yayımladığı gerçek bir FFT'den
  beslenir: sessizlik düzdür, ve konuştuğun gibi hareket eder.

  Zifiri siyah üstüne beyaz, çünkü OLED bir panelde var olan en yüksek
  kontrast çifti budur ve çubuklar 3 pikselde bile okunur kalır.

  Solda duran işaret `mark.svg`'dir ve ELLE ÇİZİLMEZ: marka kitinden
  üretilir (npm run brand). Harf orada değişince buradaki de değişir,
  ikisinin ayrışması mümkün olmasın diye.
-->
<style>
  html, body {
    width: 100%; height: 100%;
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    cursor: default;
    font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system,
                 BlinkMacSystemFont, system-ui, sans-serif;
  }

  /* Her şey ALT ORTAYA çapalı: kart kapsülü ekran kenarından dışarı
     itmek yerine onun üstünde yukarı doğru büyür. */
  #wrap {
    position: absolute;
    left: 50%; bottom: 10px;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }

  /* Kapsül aşağı değil, ENİNE açılıp kapanır: kendi merkezine çöker ve
     yok olur. Alt kenardan aşağı kayması pencerenin taşındığı gibi
     okunur; bu ise şeyin kendisinin kapandığı gibi. Eğrideki taşma,
     onu bir silme değil bir sıçrama yapan şey. */
  #pill {
    transform: scaleX(.08);
    opacity: 0;
    transform-origin: 50% 50%;
    transition: transform 240ms cubic-bezier(.34,1.42,.56,1),
                opacity 150ms ease;
  }
  #wrap.in #pill { transform: scaleX(1); opacity: 1; }

  #card {
    display: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 180ms ease, transform 220ms cubic-bezier(.22,1,.36,1);
    width: 380px;
    box-sizing: border-box;
    padding: 14px 16px 12px;
    border-radius: 14px;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.07);
    box-shadow: 0 14px 44px rgba(0,0,0,.85);
  }
  body.card #card { display: block; }
  body.card #wrap.in #card { opacity: 1; transform: none; }

  #label {
    font-size: 10px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: #8b8b8b; margin-bottom: 7px;
  }
  body.error #label { color: #d98b7a; }

  #text {
    font-size: 13.5px; line-height: 1.5; color: #ededed;
    max-height: 76px; overflow: hidden;
    /* Kesiği çırpmak yerine soldur: bu bir önizleme, ve sert bir kesiğin
       üstündeki üç nokta bir hata gibi okunur. */
    -webkit-mask-image: linear-gradient(180deg, #000 62%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 62%, transparent 100%);
    overflow-wrap: anywhere;
  }

  #act {
    margin: 11px auto 0; display: block;
    padding: 6px 22px;
    font: inherit; font-size: 12px; font-weight: 600;
    color: #e4e4e4;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 8px;
    cursor: pointer;
    transition: background 140ms ease;
  }
  #act:hover  { background: rgba(255,255,255,.12); }
  #act:active { background: rgba(255,255,255,.06); }
  #act:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 2px; }

  #pill {
    display: flex; align-items: center;
    /* Sol boşluk dar: işaretin kendi zemini var, kapsülün iç boşluğunu
       bir kez daha eklemek onu ortadan kaçırıyor. */
    padding: 7px 14px 7px 8px;
    will-change: transform, opacity;
    border-radius: 999px;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.07);
    box-shadow: 0 8px 26px rgba(0,0,0,.8);
  }
  body.card #pill { display: none; }

  /* İşaret KAPSÜLÜ BÜYÜTMEZ: ölçer tam onun kapladığı kadar daralır,
     kapsülün eni 164 pikselde kalır (24 + 8 boşluk = 32, ölçer 132'den
     108'e). Kapsül ekranın altında duran küçük bir şey; büyümesi onu
     bir bildirime çevirirdi. */
  #mark {
    width: 24px; height: 24px;
    display: block; flex: none;
    -webkit-user-drag: none;
  }
  #meter { display: block; }

  /* ÜÇÜNCÜ AŞAMA: "çeviriyor".
     Ölçer ile yükleniyor halkası aynı yeri paylaşır — biri kapanırken
     diğeri açılır, kapsül de aradaki genişlik farkını yumuşakça kapatır.
     Ölçer bir KUTUYA alındı: canvas'ın kendi genişliğini kısmak çubukları
     ezerdi, kutu ise onları kırpar. Çubuklar zaten bu sırada kendi
     yavaşlığıyla düz çizgiye iniyor (bkz. RELEASE), yani kapanma iki
     hareketin üst üste binmesi oluyor. */
  #meterwrap {
    flex: none; overflow: hidden; width: 108px; margin-left: 8px;
    transition: width 260ms cubic-bezier(.22,1,.36,1),
                margin-left 260ms cubic-bezier(.22,1,.36,1),
                opacity 150ms ease;
  }
  body.thinking #meterwrap { width: 0; margin-left: 0; opacity: 0; }

  #spin {
    flex: none; overflow: hidden; width: 0; margin-left: 0; opacity: 0;
    transition: width 260ms cubic-bezier(.22,1,.36,1),
                margin-left 260ms cubic-bezier(.22,1,.36,1),
                opacity 150ms ease 90ms;
  }
  body.thinking #spin { width: 18px; margin-left: 9px; opacity: 1; }
  #spin svg { display: block; animation: donuyor 900ms linear infinite; }
  @keyframes donuyor { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    /* Dönme yerine nabız: aynı bilgiyi verir, hareket etmez. */
    #spin svg { animation: nabiz 1.6s ease-in-out infinite; }
    @keyframes nabiz { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    #meterwrap, #spin { transition: opacity 140ms ease; }
    #pill, #card { transition: opacity 140ms ease; }
    #pill, #wrap.in #pill { transform: scaleX(1); }
    #card, body.card #wrap.in #card { transform: none; }
  }
</style>

<div id="wrap">
  <div id="card">
    <div id="label">Yazılacak yer bulunamadı</div>
    <div id="text"></div>
    <button id="act" type="button">Kopyala</button>
  </div>
  <div id="pill">
    <img id="mark" src="mark.svg" alt="" draggable="false">
    <div id="meterwrap"><canvas id="meter" width="108" height="26"></canvas></div>
    <div id="spin"><svg width="18" height="18" viewBox="0 0 18 18"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- Soluk yörünge, üstünde parlak bir yay. Yalnız yay olduğunda
           küçük boyda hilal gibi okunuyor; yörünge onu halka yapıyor. -->
      <circle cx="9" cy="9" r="6.6" fill="none" stroke="#D2F53C"
              stroke-opacity=".22" stroke-width="2.3"/>
      <circle cx="9" cy="9" r="6.6" fill="none" stroke="#D2F53C"
              stroke-width="2.3" stroke-linecap="round"
              stroke-dasharray="13 29"/>
    </svg></div>
  </div>
</div>

<script>
const wrap = document.getElementById('wrap');
const meter = document.getElementById('meter');
const mctx = meter.getContext('2d');
const labelEl = document.getElementById('label');
const textEl = document.getElementById('text');
const actBtn = document.getElementById('act');

// Arka tampon aygıt çözünürlüğünde; çizim CSS pikselinde kalır.
(function hidpi() {
  const r = window.devicePixelRatio || 1;
  const w = meter.width, h = meter.height;
  meter.style.width = w + 'px';
  meter.style.height = h + 'px';
  meter.width = Math.round(w * r);
  meter.height = Math.round(h * r);
  mctx.setTransform(r, 0, 0, r, 0, 0);
  meter._w = w; meter._h = h;
})();

const BARS = 26;
// EKOLAYZER, kayan bir dalga formu değil: her çubuk bir frekans bandına
// sahiptir ve kendi başına yükselip alçalır. Değerler mikrofonun gerçek
// FFT'sinden gelir ve bant bant normalize edilmiştir — konuşma enerjisi
// en alt banttan en üste kabaca 40 kat düşer, ve bu düzeltme olmadan sağ
// yarı neredeyse hiç oynamaz.
const bars = new Array(BARS).fill(0);   // çizilen, yumuşatılmış
let bands = new Array(BARS).fill(0);    // en son bildirilen
let state = 'idle';

// Hızlı yukarı, yavaş aşağı. Bir ölçeri ölçer gibi okutan şey bu
// bakışımsızlıktır: ani vuruşu yakalar ve sönmesine izin verir.
const ATTACK = 0.55, RELEASE = 0.11;

function draw() {
  const w = meter._w, h = meter._h;
  mctx.clearRect(0, 0, w, h);
  // İki katı çubuk, yarısı kalınlıkta; aralık da ona göre ölçekli, ki
  // sıra aynı şeridi doldursun — daha ince dişler, aynı yer kaplama.
  const gap = w / 96;
  const bw = (w - (BARS - 1) * gap) / BARS;
  const floor = 2.5;                    // dinlenme yüksekliği: asla yok olmaz
  const mid = h / 2;
  for (let i = 0; i < BARS; i++) {
    const v = bars[i];
    const bh = Math.max(floor, v * (h - floor - 1) + floor);
    mctx.fillStyle = '#FFFFFF';
    mctx.globalAlpha = 0.32 + v * 0.68;
    mctx.beginPath();
    // ORTA ÇİZGİDEN büyür, yukarı ve aşağı birlikte açılır. Alttan
    // çapalamak her çubuğa bir ağır bir de hafif uç verir; bu kadar
    // alçak bir kapsül, hareket kendi ortasına göre bakışımlı olduğunda
    // daha iyi okunur, ve dinlenirken sıra düz bir çizgiye oturur.
    // Yarıçap KISA kenarın yarısını asla aşamaz; dinlenirken çubuk
    // uzun olduğundan geniştir, yani tek başına bw/2 reddedilirdi.
    mctx.roundRect(i * (bw + gap), mid - bh / 2, bw, bh,
                   Math.min(bw, bh) / 2);
    mctx.fill();
  }
  mctx.globalAlpha = 1;
}

function frame() {
  const live = state === 'listening';
  for (let i = 0; i < BARS; i++) {
    const t = live ? (bands[i] || 0) : 0;
    bars[i] += (t - bars[i]) * (t > bars[i] ? ATTACK : RELEASE);
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const COPY = 'Kopyala', OK = 'Tamam';

// Çeviri bundan kısa sürerse yükleniyor halkası hiç görünmez.
const THINK_DELAY = 260;
let thinkTimer = null;

window.typer.onState((s) => {
  const next = s.state || 'idle';
  if (next !== state) {
    state = next;
    const card = state === 'preview' || state === 'error';
    document.body.classList.toggle('card', card);
    document.body.classList.toggle('error', state === 'error');
    // "Çeviriyor" GECİKMEYLE açılır. Kısa bir diktede çeviri yarım
    // saniyeden kısa sürer, ve orada bir an parlayıp kaybolan bir
    // yükleniyor halkası hiç olmamasından kötüdür. Uzun promptta ise
    // çeviri saniyeler sürüyor; asıl boşluk orada.
    clearTimeout(thinkTimer);
    if (state === 'thinking') {
      thinkTimer = setTimeout(
        () => document.body.classList.add('thinking'), THINK_DELAY);
    } else {
      document.body.classList.remove('thinking');
    }
    if (card) {
      labelEl.textContent = state === 'error'
        ? 'Sorun' : 'Yazılacak yer bulunamadı';
      actBtn.textContent = state === 'error' ? OK : COPY;
    }
  }
  bands = (state === 'listening' && Array.isArray(s.bands) && s.bands.length)
    ? s.bands : new Array(BARS).fill(0);
  if ((state === 'preview' || state === 'error') && textEl.textContent !== s.text) {
    textEl.textContent = s.text || '';
  }
  wrap.classList.toggle('in', state !== 'idle');
});

actBtn.addEventListener('click', () => {
  // "Kopyalandı" şovu yok: pencere okunacak kadar bile durmadan gidiyor,
  // ve kopyalamanın kendisi zaten onayın ta kendisi. Tıklama anında
  // hissedilsin diye kayma şimdi başlıyor.
  const copy = actBtn.textContent === COPY;
  wrap.classList.remove('in');
  window.typer.dismiss(copy);
});
</script>
